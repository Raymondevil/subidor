<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4f8cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Subir video</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; display: flex;
         justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .card { background: #1c1c1c; padding: 1.5rem; border-radius: 12px; width: 92%; max-width: 420px; }
  h1 { font-size: 1.2rem; margin-top: 0; }
  label { font-size: 0.85rem; color: #aaa; }
  input[type=password] { width: 100%; padding: 0.7rem; margin: 0.4rem 0 0.3rem;
         background: #2a2a2a; border: 1px solid #444; border-radius: 6px; color: #eee;
         box-sizing: border-box; font-size: 1rem; }
  .checkbox-row { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; color: #aaa; }
  .remember { margin-bottom: 1.2rem; }
  .overwrite-box { display: none; margin-bottom: 1rem; padding: 0.7rem; background: #2a2415;
                   border: 1px solid #73510d; border-radius: 6px; color: #f5c066; font-size: 0.85rem; }
  #drop { border: 2px dashed #444; border-radius: 10px; padding: 2.2rem 1rem; text-align: center;
          margin-bottom: 1rem; color: #ddd; font-size: 1.05rem; -webkit-tap-highlight-color: transparent; }
  #drop.over { border-color: #4f8cff; color: #fff; }
  button { width: 100%; padding: 0.9rem; background: #4f8cff; border: none; border-radius: 8px;
         color: white; font-size: 1.05rem; cursor: pointer; }
  button:disabled { background: #555; cursor: not-allowed; }
  button.warning { background: #e07a1f; }
  progress { width: 100%; height: 1.2rem; margin-top: 1rem; }
  #status { margin-top: 0.8rem; font-size: 0.9rem; min-height: 1.2rem; word-break: break-all; }
</style>
</head>
<body>
  <div class="card">
    <h1>Subir video al servidor</h1>
    <label>Clave de acceso</label>
    <input type="password" id="token" placeholder="Clave">
    <label class="checkbox-row remember">
      <input type="checkbox" id="remember" style="width:auto"> Recordar en este teléfono
    </label>
    <div id="drop">📷 Toca para elegir un video de tus fotos</div>
    <input type="file" id="file" accept="video/*" style="display:none">

    <div id="overwrite-box" class="overwrite-box">
      <span id="overwrite-msg">⚠️ Este archivo ya existe en el servidor.</span>
      <label class="checkbox-row" style="margin-top:0.4rem; color:#ffd982; cursor:pointer;">
        <input type="checkbox" id="overwrite" style="width:auto"> Reemplazar / sobrescribir video
      </label>
    </div>

    <button id="btn" disabled>Subir</button>
    <progress id="bar" value="0" max="100" style="display:none"></progress>
    <div id="status"></div>
  </div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const btn = document.getElementById('btn');
const bar = document.getElementById('bar');
const statusEl = document.getElementById('status');
const tokenInput = document.getElementById('token');
const rememberBox = document.getElementById('remember');
const overwriteBox = document.getElementById('overwrite-box');
const overwriteMsg = document.getElementById('overwrite-msg');
const overwriteInput = document.getElementById('overwrite');

let selectedFile = null;
let fileAlreadyExists = false;

function formatBytes(bytes) {
  if (!bytes || bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

const savedToken = localStorage.getItem('uploadToken');
if (savedToken) {
  tokenInput.value = savedToken;
  rememberBox.checked = true;
}
rememberBox.addEventListener('change', () => {
  if (!rememberBox.checked) localStorage.removeItem('uploadToken');
});

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('over');
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) setFile(fileInput.files[0]);
});

async function checkExistence(file) {
  const token = tokenInput.value;
  if (!token) return null;
  try {
    const res = await fetch(`/check-file?filename=${encodeURIComponent(file.name)}`, {
      headers: { 'x-upload-token': token }
    });
    if (res.ok) return await res.json();
  } catch (err) {
    console.error('Error al comprobar archivo:', err);
  }
  return null;
}

async function updateFileStatus() {
  if (!selectedFile) return;

  fileAlreadyExists = false;
  overwriteBox.style.display = 'none';
  overwriteInput.checked = false;
  btn.className = '';

  if (tokenInput.value) {
    statusEl.textContent = 'Comprobando si ya existe en el servidor...';
    statusEl.style.color = '#aaa';

    const info = await checkExistence(selectedFile);
    if (info && info.exists) {
      fileAlreadyExists = true;
      overwriteBox.style.display = 'block';
      overwriteMsg.textContent = `⚠️ "${info.filename}" ya existe en el servidor (${formatBytes(info.size)}).`;
      statusEl.textContent = 'El video ya fue subido anteriormente.';
      statusEl.style.color = '#f5c066';
      btn.disabled = true;
      btn.textContent = 'Ya existe en el servidor';
      return;
    }
  }

  statusEl.textContent = '';
  btn.disabled = false;
  btn.textContent = 'Subir';
}

async function setFile(file) {
  selectedFile = file;
  drop.textContent = `Seleccionado: ${file.name} (${formatBytes(file.size)})`;
  await updateFileStatus();
}

tokenInput.addEventListener('input', () => {
  if (selectedFile && !fileAlreadyExists) {
    updateFileStatus();
  }
});

overwriteInput.addEventListener('change', () => {
  if (overwriteInput.checked) {
    btn.disabled = false;
    btn.className = 'warning';
    btn.textContent = 'Sobrescribir video';
  } else {
    btn.disabled = true;
    btn.className = '';
    btn.textContent = 'Ya existe en el servidor';
  }
});

function resetUploader(keepStatus = false) {
  selectedFile = null;
  fileAlreadyExists = false;
  fileInput.value = '';
  drop.textContent = '📷 Toca para elegir un video de tus fotos';
  overwriteBox.style.display = 'none';
  overwriteInput.checked = false;
  btn.disabled = true;
  btn.className = '';
  btn.textContent = 'Subir';
  bar.style.display = 'none';
  bar.value = 0;
  if (!keepStatus) {
    statusEl.textContent = '';
  }
}

btn.addEventListener('click', async () => {
  if (!selectedFile) return;
  const token = tokenInput.value;
  if (!token) {
    statusEl.textContent = '✖ Debes ingresar la clave de acceso';
    statusEl.style.color = '#ff5555';
    return;
  }
  if (rememberBox.checked) localStorage.setItem('uploadToken', token);

  // Verificación final antes de gastar datos de subida
  if (!overwriteInput.checked) {
    statusEl.textContent = 'Verificando en el servidor...';
    const check = await checkExistence(selectedFile);
    if (check && check.exists) {
      fileAlreadyExists = true;
      overwriteBox.style.display = 'block';
      overwriteMsg.textContent = `⚠️ "${check.filename}" ya existe en el servidor (${formatBytes(check.size)}).`;
      statusEl.textContent = 'El video ya fue subido antes. No se subió para evitar duplicados.';
      statusEl.style.color = '#f5c066';
      btn.disabled = true;
      btn.textContent = 'Ya existe en el servidor';
      return;
    }
  }

  const formData = new FormData();
  formData.append('video', selectedFile);

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/upload');
  xhr.setRequestHeader('x-upload-token', token);
  if (overwriteInput.checked) {
    xhr.setRequestHeader('x-overwrite', 'true');
  }

  bar.style.display = 'block';
  bar.value = 0;
  statusEl.textContent = 'Subiendo...';
  statusEl.style.color = '#eee';
  btn.disabled = true;

  xhr.upload.addEventListener('progress', e => {
    if (e.lengthComputable) bar.value = (e.loaded / e.total) * 100;
  });

  xhr.onload = () => {
    try {
      const res = JSON.parse(xhr.responseText);
      if (xhr.status === 200) {
        resetUploader(true);
        statusEl.textContent = `✔ ${res.message}: ${res.filename}`;
        statusEl.style.color = '#44ff88';
      } else {
        btn.disabled = false;
        btn.className = '';
        btn.textContent = 'Subir';
        statusEl.textContent = `✖ ${res.error}`;
        statusEl.style.color = '#ff5555';
      }
    } catch {
      btn.disabled = false;
      btn.className = '';
      btn.textContent = 'Subir';
      statusEl.textContent = '✖ Error inesperado';
      statusEl.style.color = '#ff5555';
    }
  };

  xhr.onerror = () => {
    btn.disabled = false;
    btn.className = '';
    btn.textContent = 'Subir';
    statusEl.textContent = '✖ Error de conexión';
    statusEl.style.color = '#ff5555';
  };

  xhr.send(formData);
});
</script>
</body>
</html>
